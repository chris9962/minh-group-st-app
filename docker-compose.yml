# Postgres cho backend MGST — dev cục bộ.
# Port 5433 (không phải 5432) để không đụng Postgres nào khác đang chạy trên máy.
services:
  db:
    image: postgres:16-alpine
    container_name: mgst-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: mgst
      POSTGRES_USER: mgst
      POSTGRES_PASSWORD: mgst
    volumes:
      - mgst-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mgst -d mgst"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  mgst-pgdata:
