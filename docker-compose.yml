# Postgres và app MGST. Một file cho cả hai container.
#
# Máy chủ FPT thiếu plugin `compose` của Docker, nên ở đó vẫn dùng `docker build`
# và `docker run` tay — xem `docs/deploy-fpt-cloud.md` mục 6b. File này dùng cho
# máy local.
#
# Dev thì chỉ cần Postgres: `bun db:up` gọi đúng service `db`, không dựng `app`.
services:
  db:
    image: postgres:16-alpine
    container_name: mgst-db
    # Port 5433 (không phải 5432) để không đụng Postgres nào khác đang chạy trên máy.
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: mgst
      POSTGRES_USER: mgst
      POSTGRES_PASSWORD: mgst
    volumes:
      - mgst-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mgst -d mgst"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    container_name: mgst-app
    restart: unless-stopped
    # Chờ Postgres báo healthy rồi mới dựng app. Không chờ thì app lên trước, mọi
    # request đầu tiên trả 500 cho tới khi database sẵn sàng.
    depends_on:
      db:
        condition: service_healthy
    # Kẹp `127.0.0.1`: bỏ đi thì Docker tự mở rule iptables ra Internet, đi vòng
    # qua tường lửa của máy chủ, và app lộ ra ngoài không qua Nginx lẫn HTTPS.
    ports:
      - "127.0.0.1:3000:3000"
    # `required: false` để repo mới clone chưa có `.env.local` vẫn chạy được
    # `bun db:up`. Compose đọc trọn file này kể cả khi bạn chỉ gọi service `db`,
    # nên thiếu env file là dừng ngay ở bước phân tích, chưa tới lượt dựng gì.
    env_file:
      - path: .env.local
        required: false
    environment:
      # Ghi đè `DATABASE_URL` của `.env.local`, KHÔNG sửa file đó.
      #
      # Trong mạng của compose, app gọi Postgres bằng tên service `db` và cổng
      # TRONG container là 5432, không phải 5433. Nhưng `.env.local` còn phục vụ
      # `bun run db:migrate` và `next start` chạy trên host — hai chỗ đó cần
      # `localhost:5433`. Sửa file là hỏng cả hai.
      DATABASE_URL: postgres://mgst:mgst@db:5432/mgst
    # Driver `json-file` mặc định không xoay vòng, và Next ghi log mỗi request.
    # Chạy vài tháng là file log phình không giới hạn.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Worker PVI — bot tạo đơn, duyệt, rồi tải giấy chứng nhận.
  #
  # KHÔNG tự dựng khi `docker compose up` trống tay. Gọi đích danh:
  # `docker compose up pvi-worker`.
  #
  # ⚠️ Worker chỉ có việc khi `PVI_WORKER_BAT=1` — biến đó quyết định đơn mới vào
  # `queued` (bot chạy) hay `manual-queued` (đội KD làm tay). App và worker phải
  # cùng đọc một giá trị, nếu không thì đơn vào hàng chờ mà không ai nhặt.
  pvi-worker:
    build:
      context: .
      target: worker
    container_name: mgst-pvi-worker
    profiles: ["pvi"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env.local
        required: false
    environment:
      # Cùng lý do như service `app`: trong mạng compose, Postgres là `db:5432`.
      DATABASE_URL: postgres://mgst:mgst@db:5432/mgst
      # Worker tự bật `PVI_CHO_PHEP_LUU` và `PVI_CHO_PHEP_DUYET` lúc khởi động:
      # nó chạy là chạy thật. Muốn nó điền form rồi dừng thì thêm `--thu` vào
      # lệnh, không phải sửa biến ở đây.
      PVI_STATE: /app/session/storageState.json
    volumes:
      # Phiên đăng nhập PVI sống ngoài container. Mất nó là mỗi lần dựng lại phải
      # giải captcha đăng nhập lần nữa.
      - mgst-pvi-session:/app/session
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Bản DEV — `next dev` với hot reload, chạy song song với bản prod được vì
  # nghe cổng khác. Không tự dựng khi `docker compose up` trống tay (profiles);
  # gọi đích danh: `docker compose up app-dev`, hoặc `bun run dev:docker`.
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: mgst-app-dev
    profiles: ["dev"]
    depends_on:
      db:
        condition: service_healthy
    # 3001 chứ không phải 3000: container prod `mgst-app` (và `next dev` chạy
    # thẳng trên máy) đều giữ 3000. Kẹp loopback cùng lý do với bản prod.
    #
    # PHẢI có cả dòng IPv6: macOS phân giải `localhost` ra `::1` trước, chỉ ánh
    # xạ 127.0.0.1 thì trình duyệt gõ localhost:3001 không kết nối được.
    ports:
      - "127.0.0.1:3001:3000"
      - "[::1]:3001:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://mgst:mgst@db:5432/mgst
    volumes:
      # Mã nguồn đọc từ máy ngoài — sửa file là hot reload chạy.
      - .:/app
      # Hai volume TÊN đè lên hai thư mục con: node_modules build cho Linux
      # trong container, .next là sản phẩm của chính `next dev`. Để chúng dùng
      # chung với máy ngoài là binary macOS trộn với binary Linux, và bản
      # `bun run build` trên máy đè lên cache dev trong container.
      - mgst-dev-node-modules:/app/node_modules
      - mgst-dev-next:/app/.next

volumes:
  mgst-pgdata:
  mgst-pvi-session:
  mgst-dev-node-modules:
  mgst-dev-next:
