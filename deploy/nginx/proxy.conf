# Header chuyển tiếp dùng chung cho mọi khối `location` gọi vào Next.js.
#
# Tách ra file riêng để hai khối `/` và `/api/` không lệch nhau. Sửa một chỗ mà
# quên chỗ kia là ảnh tải lên qua được còn trang thì không, hoặc ngược lại.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Thiếu dòng này thì Next tưởng đang chạy http và sinh URL tuyệt đối sai giao thức.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
# Giữ đúng mức của cấu hình máy chủ trước 2026-08-21. Mặc định 60s là hạ mức, và
# lần đầu có người tải ảnh 10MB qua 4G ngoài hiện trường mới lộ ra.
proxy_read_timeout 300s;
