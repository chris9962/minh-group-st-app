# Phần cấu hình Nginx THUỘC VỀ APP. Đặt trong repo để đi theo git như code.
#
# Máy chủ chỉ thêm đúng một dòng vào khối `server` của
# `/etc/nginx/sites-available/mgst.conf`:
#
#     include /opt/mgst-app/deploy/nginx/app.conf;
#
# ⚠️ KHÔNG đưa cả file `mgst.conf` vào repo. Certbot ghi thẳng vào file đó mỗi
# lần cấp hay gia hạn chứng chỉ — nó tự thêm khối `listen 443 ssl`, đường dẫn
# chứng chỉ, khối chuyển 301. Deploy chạy `git reset --hard` là xoá phần certbot
# vừa ghi và HTTPS dừng.

# Khớp với chốt `content-length` trong `src/app/api/uploads/route.ts`. Trần ảnh
# là 10MB, cộng phần bao của multipart. Đổi trần thì phải đổi cả hai chỗ.
client_max_body_size 12m;

# Chế độ bảo trì bật bằng SỰ TỒN TẠI của một file, không phải bằng sửa cấu hình.
# Nhờ vậy bật và tắt không cần `nginx -t` lẫn `systemctl reload nginx`.
set $maintenance 0;
if (-f /opt/mgst-app/deploy/maintenance/on) { set $maintenance 1; }

# Chừa đường cho người vận hành kiểm bản mới trước khi mở cho mọi người.
# Bỏ trống thì không ai đi vòng được. Điền IP thật của bạn khi cần.
# if ($remote_addr = "203.0.113.10") { set $maintenance 0; }

# Mốc giờ kết thúc dự kiến, cho trang bảo trì đếm ngược.
#
# Đặt ngoài hai khối dưới nên KHÔNG bị chặn lúc bảo trì — trang cần đọc được nó
# đúng vào lúc mọi thứ khác đang trả 503. `location =` khớp chính xác nên nó
# thắng `location /`.
location = /__maintenance/until.txt {
    alias /opt/mgst-app/deploy/maintenance/until.txt;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
}

# `/api/` PHẢI đứng trước `/`, không thì mọi request API rơi vào khối dưới.
location /api/ {
    # API trả JSON, không trả HTML. FE gọi bằng fetch rồi đọc `res.ok`; nhận
    # nguyên trang HTML thì nó ném lỗi cú pháp thay vì hiện thông báo bảo trì.
    # KHÔNG dùng dấu `=`. `error_page 503 = @loc` bảo Nginx lấy mã trả về từ khối
    # @loc, nên trang tĩnh phục vụ bằng `try_files` sẽ ra 200 thay vì 503. Bỏ `=`
    # thì mã 503 gốc giữ nguyên.
    error_page 503 @bao_tri_json;
    if ($maintenance) { return 503; }

    include /opt/mgst-app/deploy/nginx/proxy.conf;
    proxy_pass http://127.0.0.1:3000;
}

location / {
    # Không dùng dấu `=` — xem ghi chú ở khối `/api/` bên trên.
    error_page 503 @bao_tri_html;
    if ($maintenance) { return 503; }

    include /opt/mgst-app/deploy/nginx/proxy.conf;
    proxy_pass http://127.0.0.1:3000;
}

location @bao_tri_html {
    root /opt/mgst-app/deploy/maintenance;
    default_type text/html;
    # 503 chứ không phải 200: trình duyệt và proxy hiểu đây là trạng thái tạm.
    # Trả 200 thì trang bảo trì nằm lại trong cache cả sau khi bạn đã tắt.
    add_header Retry-After 900 always;
    add_header Cache-Control "no-store" always;
    try_files /index.html =503;
}

location @bao_tri_json {
    default_type application/json;
    add_header Retry-After 900 always;
    add_header Cache-Control "no-store" always;
    return 503 '{"message":"Hệ thống đang bảo trì. Vui lòng thử lại sau ít phút."}';
}
